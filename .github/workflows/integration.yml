name: Integration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integrate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      MLFLOW_URL: ${{ vars.MLFLOW_URL }}
      EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests and save exit code
        id: tests
        continue-on-error: true
        run: |
          mkdir -p test-results
          PYTHONPATH=. pytest unit_tests/ --capture=tee-sys --cov=model --cov-report=term --cov-report=html --junitxml=test-results/results.xml > test-results/results.log
      
      - name: Comment test results and coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('test-results/results.log', 'utf8');
            const truncated = results.length > 65000 ? results.slice(0, 65000) + '\n...TRUNCATED...' : results;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🧪 Test Results with Coverage\n\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
