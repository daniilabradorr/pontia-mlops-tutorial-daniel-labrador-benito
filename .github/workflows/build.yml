name: build
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  train-register:
    runs-on: ubuntu-latest
    env:
      MLFLOW_URL: ${{ vars.MLFLOW_URL }}
      EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_ALIAS: ${{ vars.MODEL_ALIAS }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download dataset
        run: |
          mkdir -p data/raw
          wget -O data/raw/adult.data https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.data
          wget -O data/raw/adult.test https://archive.ics.uci.edu/ml/machine-learning-databases/adult/adult.test
      - name: Train model
        run: python src/main.py
      - name: Capture run_id
        id: runid
        run: echo "run_id=$(cat run_id.txt)" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: pytest
      - name: Register model
        env:
          RUN_ID: ${{ steps.runid.outputs.run_id }}
        run: python scripts/register_model.py
