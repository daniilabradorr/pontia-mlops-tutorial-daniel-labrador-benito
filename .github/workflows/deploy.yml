name: deploy
on:
  workflow_dispatch:

jobs:
  deploy-model:
    runs-on: ubuntu-latest
    env:
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_ALIAS: ${{ vars.MODEL_ALIAS }}
      AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      AZURE_REGION: ${{ vars.AZURE_REGION }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }} --username ${{ secrets.ACR_USERNAME }} --password ${{ secrets.ACR_PASSWORD }}

      - name: Download model from MLflow
        env:
          MLFLOW_URL: ${{ vars.MLFLOW_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_ALIAS: ${{ vars.MODEL_ALIAS }}
        run: |
          pip install mlflow
          mkdir -p models
          mlflow models download -m "models:/${MODEL_NAME}@${MODEL_ALIAS}" -d models

      - name: Build Docker image
        run: docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} -f deployment/Dockerfile .

      - name: Push Docker image
        run: docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Container Instances
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_CONTAINER_NAME }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --registry-login-server ${{ secrets.ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --cpu 1 --memory 1 \
            --ports 8000 \
            --location ${{ env.AZURE_REGION }} \
            --environment-variables MODEL_NAME=${{ env.MODEL_NAME }} MODEL_ALIAS=${{ env.MODEL_ALIAS }}

      - name: Wait for deployment
        run: sleep 60

      - name: Test API endpoint
        run: |
          containerIP=$(az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_CONTAINER_NAME }} \
            --query ipAddress.ip --output tsv)
          echo "Public IP: $containerIP"
          curl -X POST "http://$containerIP:8000/predict" \
            -H "Content-Type: application/json" \
            -d '{"features":[25,0,226802,7,14,0,9,0,4,0,2174,0,40,39]}'
